[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routewise"
version = "0.1.0"
description = "Workload-specific, quality-constrained model routing on Nebius Token Factory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "pandas>=2.2"]
ml = ["scikit-learn>=1.5", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
routewise = "routewise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
