# The evaluation runs the write-up cites, in the order they were run, and the role each plays.
# The headline is the pre-registered primary run, whatever later runs show.
headline: eval-20261025T170223Z-7e4682

evaluations:
  - run: eval-20261025T170223Z-7e4682
    role: Primary (pre-registered)
    note: >-
      Policy and thresholds frozen in git before the run. Quality targets met at ~91% lower cost than
      always-Ultra; extraction p95 (5.0 s) missed the 4 s ceiling because of two provider-side latency
      bursts on Nemotron 3 Nano.
  - run: eval-20261025T171615Z-4ca4e4
    role: Follow-up (post-hoc)
    note: >-
      Hedged escalation added after the primary run. No latency bursts occurred, so hedging never fired;
      the two RouteWise variants behaved identically, which shows run-to-run variance.
  - run: eval-20261025T174144Z-d1e7da
    role: Controlled fault injection
    note: >-
      A seeded 10% of extraction requests had a synthetic 3-6 s stall on every Nano call, identically for
      every strategy. Unhedged RouteWise missed the p95 ceiling (4.3 s); hedged RouteWise met it (2.7 s)
      at ~20% more cost, still ~89% below always-Ultra.

# Separate fresh-data studies; the original v1 headline above is unchanged.
confirmation_studies:
  - run: confirmation-20261025T210209Z-a62cb8
    role: M5 measurement abort (post-registration)
    note: >-
      Stopped after a tuning-only audit found arrival dates labelled as issue dates.
      All 565 completed requests and their priced usage remain; no M5 success is claimed.
      A new seed and dataset were used for M6 instead of relabelling this frozen set.
  - run: confirmation-20261025T212745Z-ac61b1
    role: M6 preregistered replacement confirmation
    display_milestone: M5  # Presentation label; original study identity is unchanged.
    note: >-
      330 unique held-out conversations, nine live configurations and three time windows,
      plus 24 repeated sentinel conversations. The source-grounded Nano-to-Super route
      reaches 98.2% task accuracy (96.5% lower confidence bound), 2.44 s p95 and
      $0.103 per 1k tasks, about 70% below the qualifying matched grounded-Super control.
      The predeclared hedged intervention also passes; the optimizer chooses unhedged
      routing because both meet the deadline and hedging costs about 29% more.
  - run: datesconfirm-20261026T133902Z-ab36f4
    role: M7 preregistered relative-date recovery confirmation
    display_milestone: M6  # Presentation label; original study key m7.
    note: >-
      Deterministic issue-date normalization, selected on development data and frozen before any
      confirmation conversation existed. On 367 fresh relative-date challenge conversations (90 requiring
      review), correct autonomous completions rose from 30.8% to 75.5% (+44.7 points, 95% CI 39.5-49.6)
      with no wrong answers released (current route: 153). On 312 separate representative conversations:
      98.4% correct without review, 100% task accuracy, $0.080 per 1k (23% below the M5 route); the
      deadline gate passed narrowly (4.9% upper bound) on a slower Nano serving day. All gates passed; adopted.
  - run: valnoise-20261027T021106Z-4ef4da
    role: M8 noise component (preregistered amendment)
    display_milestone: M7  # Presentation label; original study key m8.
    note: >-
      The 679 sealed M6 confirmation conversations, run clean and with writing noise measured in the
      user's de-identified mailbox (mostly dropped punctuation, lowercase messages and split turns;
      misspellings are rare there). Noise changed no adopted-profile answer on the 312 representative
      conversations and released no wrong answer on either set. N1, N3, N4 and N5 passed. N2 failed
      on the 4 s deadline only (upper bound 15.9% noisy, 10.9% clean), so robustness is not shown under
      the preregistered rule. Synthetic prose; not evidence about real conversations.
